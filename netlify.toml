# ============================================================
# netlify.toml — LeleHub Farm (static multi-page site)
# ============================================================

[build]
  publish = "."

# ----------------------------------------------------------
# Security headers for all routes
# (replaces Apache .htaccess headers, which Netlify ignores)
# ----------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options              = "SAMEORIGIN"
    X-Content-Type-Options       = "nosniff"
    Referrer-Policy              = "strict-origin-when-cross-origin"
    Permissions-Policy           = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security    = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy      = "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests"

# ----------------------------------------------------------
# Long-lived cache for static assets (1 month)
# ----------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
